<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your bucket — OC Foundry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20" />
  </head>
  <body class="bucket-page">
    <main class="bucket-wrap">
      <a class="brand" href="index.html"><span class="brand-mark">✦</span> OC Foundry</a>

      <header class="bucket-header">
        <p class="eyebrow" style="justify-content:flex-start;"><span></span> Your bucket</p>
        <h1>Character sheets<br /><em>ready to keep.</em></h1>
        <p class="bucket-sub">Add as many as you like, then buy them all in one go.</p>
      </header>

      <section id="bucket-empty" class="bucket-empty" style="display:none;">
        <p class="eyebrow" style="justify-content:center;"><span></span> Empty for now</p>
        <h2 style="font:700 32px Fraunces,serif; margin:12px 0;">No characters in your bucket yet.</h2>
        <p style="color:var(--muted); margin-bottom:22px;">Generate a character and click “Add to bucket”.</p>
        <a class="pay-button" href="index.html" style="display:inline-block; width:auto; padding:14px 22px; text-decoration:none;">← Back to generator</a>
      </section>

      <section id="bucket-content" style="display:none;">
        <div class="bucket-list" id="bucket-list"></div>

        <div class="bucket-summary">
          <div>
            <div style="color:var(--muted); font-size:13px;">Total</div>
            <div class="total" id="bucket-total">₹0</div>
            <div style="color:var(--muted); font-size:12px;" id="bucket-count-label">0 sheets</div>
          </div>
          <button class="pay-button" id="bucket-checkout" type="button" style="width:auto; padding:14px 22px;">
            Buy all sheets →
          </button>
        </div>
      </section>
    </main>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="bucket.js"></script>
  </body>
</html>
